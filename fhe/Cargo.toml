[workspace]
resolver = "3"
members = ["cube", "solver", "circuit", "ckks", "protocol", "client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rubikfhe-cube = { path = "cube" }
rubikfhe-solver = { path = "solver" }
rubikfhe-circuit = { path = "circuit" }
rubikfhe-ckks = { path = "ckks" }
anyhow = "1"
# poulpy main, pinned until v0.10.0 is released.
poulpy-hal = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-core = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-ckks = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-cpu-arm = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-cpu-avx = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-cpu-avx512 = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-cpu-portable = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
poulpy-gpu-portable = { git = "https://github.com/poulpy-fhe/poulpy", rev = "6018905c5be25070a0e5b2b31759cb96468b5908" }
rubikfhe-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
axum = "0.8"

# Table generation is slow unoptimized; keep tests and dev runs usable.
[profile.dev.package.rubikfhe-cube]
opt-level = 3
[profile.dev.package.rubikfhe-solver]
opt-level = 3
[profile.dev.package.rubikfhe-circuit]
opt-level = 3
